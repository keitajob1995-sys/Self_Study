<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/style.css" />
    <title>4択問題練習ツール</title>
  </head>

  <body>
    <div class="header">
      <a href="../index.html" >
        <img src="../img/tsukamoto_logo_image.png" width="60px" class="logo" alt="Logo">
      </a>
        <div class="title-area">
            <h2>自習ツール【4択問題】</h2>
        <div id="score-display" class="score-display">正解数：0 / 0</div>
      </div>
      <button id="addSetBtn">＋ 問題追加</button>
      <button id="shuffleSetsBtn">問題の並び替え</button>
      <button id="copyAllBtn">テキストとしてコピー</button>
      <button id="reviewWrongBtn">復習モード</button>
      <button id="showAllSetsBtn">全セット再表示</button>
      <button id="backToTopBtn">TOPへ戻る</button>
    </div>

    <!-- ★ これが絶対に必要 -->
    <div id="container"></div>

    <template id="qa-template">
      <div class="qa-set">
        <div class="set-number"></div>

        <div class="question-box">
          <label>問題：</label><br />
          <textarea class="question"></textarea>
        </div>

        <div class="choices-box">
          <label>選択肢：</label><br />

          <div class="choice-item">
            <input type="radio" name="choice" class="choice-radio">
            <span class="choice-text"></span>
          </div>

          <div class="choice-item">
            <input type="radio" name="choice" class="choice-radio">
            <span class="choice-text"></span>
          </div>

          <div class="choice-item">
            <input type="radio" name="choice" class="choice-radio">
            <span class="choice-text"></span>
          </div>

          <div class="choice-item">
            <input type="radio" name="choice" class="choice-radio">
            <span class="choice-text"></span>
          </div>
        </div>

<div class="answer-box">
  <label>正解：</label><br />
  <textarea class="answer-text"></textarea>

  <button class="hide-answer-btn">隠す</button>
  <button class="show-answer-btn">表示</button>

  <button class="delete-set-btn">削除</button>
</div>

    </template>

    <script src="../js/choices.js"></script>
  </body>
</html>
